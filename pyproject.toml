[project]
name = "langchain-learn"
version = "0.1.0"
description = "Add your description here"

requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "langchain>=1.3.14",
    "langchain-dashscope>=0.1.8",
    "langchain-ollama>=1.1.0",
    "langchain-openai==1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-cli[inmem]>=0.4.31",
    "matplotlib>=3.11.0",
    "msgpack>=1.2.0",
    "pypdf>=6.12.2",
    "rich>=15.0.0",
    "tiktoken>=0.7.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = [
    "unit1_大模型基础篇*",
    "unit2_rag_基础篇*",
    "unit3_agent_基础篇*",
    "unit4_智能保险客服助手_v1*",
    "unit6_智能保险客服助手_v2*",
    "unit8_webui与部署篇*",
    "util*"
]
